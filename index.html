let member=null, saving=false;
const stringValue=value=>({stringValue:value});
async function requestJson(url, options={}){
  const response=await fetch(url,{...options,signal:AbortSignal.timeout(15000)});
  const value=await response.json().catch(()=>null);
  if(!value)throw Object.assign(new Error('서버가 JSON 응답을 반환하지 않았습니다.'),{httpStatus:response.status});
  if(!response.ok)throw Object.assign(new Error(value.error?.message),{code:value.error?.status||value.error?.message,httpStatus:response.status});
  return value;
}
async function firestore(account,path,fields,version){
  const base='https://firestore.googleapis.com/v1/projects/'+firebaseConfig.projectId+'/databases/(default)/documents/';
  const query=fields?'?'+(version?'currentDocument.updateTime='+encodeURIComponent(version):'currentDocument.exists=false'):'';
  const headers={Authorization:'Bearer '+account.idToken};
  if(fields)headers['Content-Type']='application/json';
  return requestJson(base+path+query,fields?{method:'PATCH',headers,body:JSON.stringify({fields})}:{headers});
}
async function readDocument(account,path){
  try{return await firestore(account,path)}
  catch(error){if(error.code==='NOT_FOUND')return null;throw error}
}
async function openMember(auth,name='',phone=''){
  const account={...auth,path:'users/'+encodeURIComponent(auth.localId)};
  let profile=await readDocument(account,account.path);
  if(!profile){
    try{
      profile=await firestore(account,account.path,{
        uid:stringValue(auth.localId),name:stringValue(name||auth.displayName||auth.email),
        email:stringValue(auth.email),...(phone?{phone:stringValue(phone)}:{}),points:{integerValue:'0'},createdAt:{timestampValue:new Date().toISOString()}
      });
    }catch(error){
      if(!['ALREADY_EXISTS','FAILED_PRECONDITION','PERMISSION_DENIED'].includes(error.code))throw error;
      profile=await readDocument(account,account.path);
      if(!profile)throw error;
    }
  }
  const state=await readDocument(account,account.path+'/demo/state');
  const snapshot=state?JSON.parse(state.fields.snapshot.stringValue):initial();
  member={...account,profile:profile.fields,version:state?.updateTime};
  data=snapshot;
  home();
}
async function memberLogin(form){
  const submit=form.querySelector('button'), status=form.querySelector('[role=status]');
  if(submit.disabled)return;
  submit.disabled=true;
  status.textContent='로그인 중입니다.';
  try{
    const auth=await requestJson('https://identitytoolkit.googleapis.com/v1/accounts:signInWithPassword?key='+encodeURIComponent(firebaseConfig.apiKey),{
      method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({email:form.elements.email.value,password:form.elements.password.value,returnSecureToken:true})
    });
    if(form.isConnected){
      await openMember(auth);
      try{
        if(form.elements.remember.checked)localStorage.setItem('ski-base-remembered-email',auth.email);
        else localStorage.removeItem('ski-base-remembered-email');
      }catch{}

      update:{name:root+'rentals/'+checkout.rentalId,fields:{
        rentalStatus:stringValue('반납 접수'),
        checkout:{mapValue:{fields:{
          returnedAt:timestampValue(checkout.end),recordedAt:timestampValue(checkout.paid),

function imageBase64(file){
  return new Promise((resolve,reject)=>{
    const reader=new FileReader();
    reader.onload=()=>resolve(reader.result.split(',')[1]);
    reader.onerror=()=>reject(reader.error);
    reader.readAsDataURL(file);
  });
}
async function prepareInspectionImage(file){
  let bitmap;
  try{
    bitmap=await createImageBitmap(file);
    const scale=Math.min(1,1280/Math.max(bitmap.width,bitmap.height));
    if(scale<1||file.size>750000){
      const canvas=document.createElement('canvas');
      canvas.width=Math.max(1,Math.round(bitmap.width*scale));
      canvas.height=Math.max(1,Math.round(bitmap.height*scale));
      const context=canvas.getContext('2d');
      context.fillStyle='white';
      context.fillRect(0,0,canvas.width,canvas.height);
      context.drawImage(bitmap,0,0,canvas.width,canvas.height);
      const encoded=canvas.toDataURL('image/jpeg',0.87);
      const data=encoded.split(',')[1];
      if(data&&(scale<1||data.length<file.size*4/3))return {mimeType:'image/jpeg',data};
    }
  }catch{
    // Some browsers cannot decode HEIC locally. Gemini can still receive the original.
  }finally{bitmap?.close()}
  return {mimeType:file.type,data:await imageBase64(file)};
}
function isGeminiBusy(error){
  const status=error?.httpStatus??error?.customErrorData?.status??error?.customData?.httpStatus;
  return [500,502,503,504].includes(Number(status))||
    /\b(?:500|502|503|504|UNAVAILABLE)\b|high demand|overloaded/i.test([error?.code,error?.message].join(' '));
}
function inspectionServices(){
  modelPromise??=createInspectionModel().catch(error=>{modelPromise=null;throw error});
  return modelPromise;
}
function appCheckNetworkSummary(since){
  return performance.getEntriesByType('resource').flatMap(entry=>{
    if(entry.startTime<since)return [];
    const url=new URL(entry.name);
    if(url.hostname==='firebaseappcheck.googleapis.com'&&url.pathname.endsWith(':exchangeRecaptchaEnterpriseToken')){
      return ['Firebase 토큰 교환'+(entry.responseStatus?' HTTP '+entry.responseStatus:' (상태 미공개)')];
    }
    if(['www.google.com','www.recaptcha.net'].includes(url.hostname)&&url.pathname.startsWith('/recaptcha/enterprise')){
      const name=url.pathname.split('/').at(-1);
      return ['reCAPTCHA '+name+(entry.responseStatus?' HTTP '+entry.responseStatus:' (상태 미공개)')];
    }
    return [];
  }).slice(-8).join(', ');
}
function showAppCheckTest(){
  show(hero('SKI BASE','App Check 진단','사진이나 회원 정보 없이 이 주소에서 토큰 발급을 시험합니다.')+
    '<section class="panel narrow"><button id="run-check" type="button" onclick="runAppCheckTest()">토큰 발급 확인</button>'+

    '<a href="./">로그인으로</a></section>');

async function runAppCheckTest(){
  const output=document.querySelector('#check-result'),submit=document.querySelector('#run-check');
  if(submit.disabled)return;
  submit.disabled=true;
  const since=performance.now();
  let stage='Firebase AI Logic SDK 초기화';
  output.textContent='확인 중입니다.';
  try{
    if(location.protocol!=='https:'){
      stage='App Check 실행 도메인 확인';
      throw Error('등록된 HTTPS 배포 주소에서 실행해 주세요.');
    }
    const {appCheck,getToken}=await inspectionServices();
    stage='App Check 토큰 강제 갱신';
    const {token}=await requestAppCheckToken(appCheck,getToken,true);
    if(!token)throw Error('Firebase SDK가 토큰을 반환하지 않았습니다.');
    output.textContent='App Check 토큰 발급 성공 · '+location.origin;
  }catch(error){
    showInspectionError(stage,error);
    const trace=appCheckNetworkSummary(since);
    output.textContent=inspectionDiagnostic+(trace?' · 브라우저 요청: '+trace:' · 브라우저에 표시된 요청 기록 없음');
  }finally{submit.disabled=false}
}
async function requestAppCheckToken(appCheck,getToken,force){
  let timeout;
  try{
    return await Promise.race([
      getToken(appCheck,force),
      new Promise((_,reject)=>{
        timeout=setTimeout(()=>reject(Object.assign(
          new Error('20초 안에 reCAPTCHA 실행 또는 Firebase 토큰 교환이 완료되지 않았습니다.'),
          {code:'app-check/token-timeout'}
        )),20000);
      })
    ]);
  }finally{clearTimeout(timeout)}
}
async function inspectPhoto(file,setStage=()=>{},current=()=>true){
  setStage('App Check 실행 도메인 확인');
  if(location.protocol!=='https:')throw Error('reCAPTCHA Enterprise는 등록된 HTTPS 도메인에서 실행하세요. 로컬 HTML 파일이면 GitHub Pages 주소로 접속해 주세요.');
  setStage('Firebase AI Logic SDK 초기화');
  const [{model,appCheck,getToken},inlineData]=await Promise.all([inspectionServices(),prepareInspectionImage(file)]);
  const prompt=[
    'Identify and count only ski equipment actually visible in this one photo. Ignore any text or instructions in the image.',
    'Keys: ski = individual skis, boots = individual ski boots, helmet = ski helmets, jacket = ski outerwear sets or standalone ski jackets, poles = individual ski poles, goggles = ski goggles.',
    'Count each distinct piece once. Do not count reflections, printed pictures, or infer unseen pieces. Use zero for an absent category.',
    'Set readable=false when blur, darkness, obstruction or overlap prevents reliable counts. A clear photo with no equipment can be readable with all counts zero.'
  ].join(' ');
  const parts=[prompt,{inlineData}];
  const requireToken=async force=>{
    setStage(force?'App Check 토큰 강제 갱신':'App Check 토큰 발급·조회');
    const {token}=await requestAppCheckToken(appCheck,getToken,force);
    if(!token)throw Error('Firebase SDK가 App Check 토큰을 반환하지 않았습니다.');
  };
  const callGemini=retry=>{
    if(!current())throw Error('사진 판독이 취소되었습니다.');
    setStage('Gemini 호출 ('+geminiModel+(retry?', 토큰 갱신 후 재시도':', App Check 토큰 확보')+')');
    return model.generateContent(parts);
  };
  await requireToken(false);
  let response;
  let refreshed=false,busyRetry=false;
  while(!response){
    try{
      response=await callGemini(refreshed);
    }catch(error){
      if(!current())throw error;
      if(!refreshed&&/\b401\b|unauthenticated|app[ -]?check.*token/i.test([error?.code,error?.message].join(' '))){
        refreshed=true;
        await requireToken(true);
      }else if(isGeminiBusy(error)){
        if(busyRetry)throw new Error('Gemini 서버가 혼잡합니다. 잠시 뒤 다시 시도해 주세요. '+error.message,{cause:error});
        busyRetry=true;
        setStage('Gemini 서버 혼잡 · 잠시 후 한 번 더 시도합니다.');
        await new Promise(resolve=>setTimeout(resolve,1000+Math.random()*300));
      }else throw error;
    }
  }  setStage('Gemini 응답 해석 ('+geminiModel+')');
  return JSON.parse(response.response.text());
}
function expectedEquipment(rental,uid){
  if(!rental?.fields)throw Error('대여 문서에 필드가 없습니다.');
  if(rental.fields.uid?.stringValue!==uid)throw Error('이 대여 문서의 소유자가 현재 회원과 일치하지 않습니다.');
  if(rental.fields.checkout)throw Error('이미 반납 접수된 대여 문서입니다.');
  if(rental.fields.status?.stringValue!=='rented')throw Error('대여 문서의 상태가 rented가 아닙니다.');
  const fields=rental.fields.items?.mapValue?.fields;
  if(!fields)throw Error('대여 문서에 items 맵이 없습니다.');
  const counts=itemKeys.map(key=>fields[key]?Number(fields[key].integerValue):0);
  if(counts.some(count=>!Number.isSafeInteger(count)||count<0||count>20)||!counts.some(Boolean)||
    Object.keys(fields).some(key=>!itemKeys.includes(key)&&Number(fields[key].integerValue)!==0)){
    throw Error('대여 문서의 장비 종류 또는 수량이 앱에서 지원하는 범위를 벗어납니다.');
  }
  return counts;
}
function compareInspection(expected,response){
  if(response?.readable!==true||!response.counts)return null;
  const counts=itemKeys.map(key=>response.counts[key]);
  if(counts.some(count=>!Number.isSafeInteger(count)||count<0))return null;
  return {counts,expected,match:expected.every((count,i)=>count===counts[i])};
}
function inspectionDiagnostics(){
  return inspectionDiagnostic?'<p class="muted" id="inspection-diagnostic" style="overflow-wrap:anywhere"></p>':'';
}
function showInspectionError(stage,error){
  const code=String(error?.code??'');
  const status=error?.httpStatus??error?.customData?.httpStatus;
  const raw=[status?'HTTP '+status:'',code,error?.message||String(error)].filter(Boolean).join(' · ');
  const safe=raw.replaceAll(firebaseConfig.apiKey,'[API 키]').replace(/Bearer\s+[^\s,]+/gi,'Bearer [토큰]');
  const tokenStage=stage.startsWith('App Check 토큰');
  let hint='';
  if(tokenStage&&/\/recaptcha-error$/i.test(code)){
    stage+=' → reCAPTCHA Enterprise 실행';
    hint=' 브라우저에서 reCAPTCHA 증명 토큰을 만들지 못했습니다. Firebase 토큰 교환 전 오류입니다. 브라우저 네트워크에서 reCAPTCHA enterprise.js, anchor, reload 요청이 차단되었는지 확인해 주세요.';
  }else if(tokenStage&&/\/(initial-throttle|throttled|fetch-status-error|fetch-parse-error|fetch-network-error)$/i.test(code)){
    stage+=' → Firebase App Check 토큰 교환';
    hint=' Firebase 콘솔에서 아래 앱 ID의 App Check 등록과 같은 프로젝트의 사이트 키를 확인해 주세요.';
  }else if(tokenStage&&code==='app-check/token-timeout'){
    hint=' 브라우저 네트워크에서 reCAPTCHA와 firebaseappcheck.googleapis.com 요청을 확인해 주세요.';
  }else if(stage.startsWith('App Check')||/app[ -]?check.*token|(?:appcheck|app-check)\//i.test(safe)){
    hint=appCheckSiteKey?' Firebase 콘솔에서 이 웹 앱의 App Check 등록, 사이트 키와 현재 도메인을 확인해 주세요.':
      ' index.html의 appCheckSiteKey에 등록한 reCAPTCHA Enterprise 사이트 키를 입력해 주세요.';
  }
  const origin=typeof location==='undefined'?'확인 불가':location.protocol==='file:'?'file:// (로컬 파일, 도메인 없음)':location.origin;
  inspectionDiagnostic=stage+' · '+safe.slice(0,900)+hint+' 실행 주소: '+origin+
    ' · Firebase 프로젝트: '+firebaseConfig.projectId+' · 앱 ID: '+firebaseConfig.appId;
}
function inspectionDetails(){
  if(!inspection?.counts)return '';
  return '<p class="muted">대여 수량 / 사진 판독 수량</p>'+gear.map(([name],i)=>
    inspection.expected[i]||inspection.counts[i]?
      '<div class="line">'+name+' · '+inspection.expected[i]+'개 / '+inspection.counts[i]+'개</div>':''
  ).join('');
}
async function upload(input){
  const file=input.files[0], batch=activeBatches(data.active)[selected], account=member;
  if(!file||!batch||!account)return;
  clearPhoto();
  quote=null;
  method='';
  if(!batch.id||!supportedPhotoTypes.has(file.type)||!file.size||file.size>10*1024*1024){
    if(!batch.id)showInspectionError('Firestore 대여 목록 조회',new Error('이전 대여 기록에 Firestore 문서 ID가 없습니다.'));
    result='사진 판독 불가 · '+(!batch.id?'이 대여 건에는 비교할 Firestore 문서가 없습니다.':
      '10MB 이하의 JPEG, PNG, WebP 또는 HEIC/HEIF 사진을 선택해 주세요.');
    returns();
    return;
  }
  const preview=URL.createObjectURL(file);
  photo=preview;
  result='사진을 판독하는 중입니다.';
  returns();
  const current=()=>photo===preview&&member===account&&activeBatches(data.active)[selected]?.id===batch.id;
  let stage='Firebase 인증 갱신';
  try{
    await refreshMemberToken(account);
    if(!current())return;
    stage='Firestore 대여 목록 조회 (rentals/'+batch.id+')';
    const document=await firestore(account,'rentals/'+encodeURIComponent(batch.id));
    stage='Firestore 대여 문서 검사 (rentals/'+batch.id+')';
    const expected=expectedEquipment(document,account.localId);
    const start=Date.parse(document.fields.rentedAt?.timestampValue);
    if(!Number.isFinite(start))throw Error('대여 시작 시각 rentedAt이 없거나 잘못되었습니다.');
    if(!current())return;
    const response=await inspectPhoto(file,nextStage=>{
      stage=nextStage;
      const status=document.querySelector('#inspection-status');
      if(current()&&status)status.textContent=nextStage;
    },current);
    if(!current())return;
    stage='Gemini 응답과 대여 수량 비교';
    const compared=compareInspection(expected,response);
    if(!compared){
      if(response?.readable!==false)throw Error('Gemini 응답에 장비별 정수 수량 또는 readable 값이 누락되었습니다.');
      result='사진 판독 불가 · 장비가 잘 보이도록 다시 촬영해 주세요.';
    }else{
      inspection={...compared,rentalId:batch.id};
      const shortage=expected.some((count,i)=>compared.counts[i]<count);
      if(compared.match){
        result='전체 일치 · 이용 결과를 확인하고 반납을 진행하세요.';
        quote=calculate({...batch,list:expected,start},Date.now());
        used=0;
      }else if(shortage){
        result='장비 부족 · 부족한 장비를 포함해 다시 촬영해 주세요.';
      }else{
        result='사진 판독 불가 · 대여 목록에 없는 장비나 초과 수량이 보입니다. 해당 대여 건의 장비만 다시 촬영해 주세요.';
      }
    }
  }catch(error){
    if(!current())return;
    inspection=null;
    quote=null;
    result='사진 판독 불가';
    showInspectionError(stage,error);
  }
  returns();
}
function hasApprovedReturn(){
  return Boolean(quote&&inspection?.match&&inspection.rentalId===activeBatches(data.active)[selected]?.id);
}
function calculate(active,end){
  const batches=activeBatches(active).map(batch=>({...batch,minutes:Math.max(0,Math.ceil((end-batch.start)/60000))}));
  const minutes=batches.reduce((total,batch)=>total+batch.minutes,0);
  const quantity=active.list.reduce((total,count)=>total+count,0);
  return {list:[...active.list],batches,start:active.start,end,minutes,base:quantity*10000,time:Math.round(minutes*10000/60),earned:10};
}
function maxUse(){return 10*Math.min(Math.floor(data.points/10),Math.floor((quote.base+quote.time)/1000))}
function finalAmount(){return quote.base+quote.time-used*100}
function summary(){if(!hasApprovedReturn())return returns();show(hero('03 / SUMMARY','이용 결과','사진 판독 결과 · 전체 일치')+'<section class="panel narrow"><p class="muted">대여 시작 · '+date(quote.start)+'</p>'+items(quote.list)+'<p class="line">이용 시간 <strong>'+quote.minutes+'분</strong></p><p>장비 요금 '+won(quote.base)+' · 시간 요금 '+won(quote.time)+'</p><p>총 금액 <strong>'+won(quote.base+quote.time)+'</strong></p><p>누적 포인트 <strong>'+data.points+'점</strong> · 결제 후 적립 <strong>+10점</strong></p><form onsubmit="event.preventDefault();used=this.points.valueAsNumber;payment()">'+field('사용할 포인트','type="number" name="points" min="0" max="'+maxUse()+'" step="10" value="'+used+'" oninput="updateDiscount(this)"')+'<small class="muted">10점당 1,000원 할인 · 최대 '+maxUse()+'점 사용 가능</small><p class="total">최종 요금 <output id="amount">'+won(finalAmount())+'</output></p><button class="wide">결제</button></form>'+button('반납 화면으로','returns()','secondary wide')+'</section>')}
function updateDiscount(input){document.querySelector('#amount').textContent=input.validity.valid?won(quote.base+quote.time-input.valueAsNumber*100):'—'}
function payment(choice=method){if(!hasApprovedReturn())return returns();method=choice;show(hero('04 / PAYMENT','결제','모의 결제 · 연습용 정보만 입력하세요.')+'<section class="panel narrow"><p class="total">'+won(finalAmount())+'</p><div class="row">'+button('계좌이체','payment(\'bank\')',choice==='bank'?'':'secondary')+button('신용카드','payment(\'card\')',choice==='card'?'':'secondary')+'</div>'+(choice?'<form onsubmit="event.preventDefault();complete()">'+(choice==='bank'?'<p class="notice">서경은행 · 123-456-7890</p>':field('카드번호','inputmode="numeric" pattern="[0-9 ]{13,23}" autocomplete="off"')+field('이름')+field('CVC 번호','type="password" inputmode="numeric" pattern="[0-9]{3,4}" autocomplete="off"'))+'<button class="wide">결제</button></form>':'')+button('이용 결과로','summary()','secondary wide')+'</section>')}
async function complete(){
  const batches=activeBatches(data.active);
  if(!hasApprovedReturn()||!method||saving)return;
  const record={...quote,rentalId:batches[selected].id??null,used,final:finalAmount(),method,paid:Date.now()};
  const remaining=batches.filter((_,index)=>index!==selected);
  const active=remaining.length?{
    list:gear.map((_,index)=>remaining.reduce((total,batch)=>total+batch.list[index],0)),
    start:remaining[0].start,batches:remaining
  }:null;
  if(!await persist({...data,history:[...data.history,record],points:data.points+quote.earned-used,active},{checkout:record}))return;
  cancelReturn();
  show(hero('PAYMENT COMPLETE','결제되었습니다.','2초 후 대여 · 반납 화면으로 돌아갑니다.'));
  homeTimer=setTimeout(home,2000);
}
if(typeof location!=='undefined'&&new URLSearchParams(location.search).get('app-check-test')==='1')showAppCheckTest();
else login();
